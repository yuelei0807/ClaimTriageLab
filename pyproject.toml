[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "claimtriagelab"
version = "0.1.0"
description = "Local-first synthetic insurance claim triage research project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ClaimTriageLab contributors" }]
dependencies = []

[project.scripts]
claimtriagelab = "claimtriagelab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claimtriagelab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".bootstrap", ".venv"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
